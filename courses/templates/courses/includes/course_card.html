<div class="col-md-6 col-lg-4">
  <article class="card h-100 course-card">
    <div class="card-body">
      <span class="badge {% if card_course.is_active %}text-bg-success{% else %}text-bg-secondary{% endif %}">
        {% if card_course.is_active %}активен{% else %}завершён{% endif %}
      </span>
      <h2 class="h5 mt-3">{{ card_course.name }}</h2>
      <p class="text-secondary mb-3">
        Материалов: {{ card_course.materials_count }} · студентов: {{ card_course.students_count }}
      </p>
      <a class="stretched-link" href="{% url 'courses:detail' card_course.id %}">
        Открыть курс
      </a>
    </div>
  </article>
</div>
